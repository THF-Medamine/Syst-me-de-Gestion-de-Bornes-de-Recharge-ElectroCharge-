{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">👥 Gestion des techniciens</h2>
    <a href="{% url 'bornes:user_add' %}" class="btn btn-success">➕ Ajouter un technicien</a>
  </div>
  
  <div class="card border-0" style="background:#161b22; border:1px solid #30363d !important;">
    <div class="card-body p-0">
      <table class="table mb-0">
        <thead class="table-dark">
          <tr><th>Nom</th><th>Rôle</th><th>Téléphone</th><th>Matricule</th><th>Actions</th></tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.profile.get_role_display }}</td>
            <td>{{ user.profile.telephone }}</td>
            <td>{{ user.profile.matricule }}</td>
            <td>
              <a href="{% url 'bornes:user_delete' user.pk %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer cet utilisateur ?')">🗑️</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
