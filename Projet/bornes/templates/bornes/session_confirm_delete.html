{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow text-center">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0">Confirmation</h4>
        </div>
        <div class="card-body">
          <p class="mb-4">Supprimer la session du <strong>{{ object.date_debut|date:"d/m/Y H:i" }}</strong> sur la borne <strong>{{ object.borne.identifiant }}</strong> ?</p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger w-100">Supprimer</button>
              <a href="{% url 'bornes:sessions' %}" class="btn btn-secondary w-100">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
