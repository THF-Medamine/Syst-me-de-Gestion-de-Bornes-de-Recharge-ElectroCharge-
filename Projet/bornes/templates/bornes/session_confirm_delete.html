{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="card border-0"
           style="background:#161b22; border:1px solid #30363d !important;">
        <div class="card-body p-4 text-center">

          <div class="fs-1 mb-3">🗑️</div>
          <h5 class="fw-bold mb-2">Confirmer la suppression</h5>
          <p class="text-secondary mb-4">
            Supprimer la session du
            <strong class="text-white">
              {{ object.date_debut|date:"d/m/Y H:i" }}
            </strong>
            sur la borne
            <strong class="text-white">{{ object.borne.identifiant }}</strong> ?
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger w-100">
                Supprimer
              </button>
              <a href="{% url 'bornes:sessions' %}"
                 class="btn btn-outline-secondary w-100">
                Annuler
              </a>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
