<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroCharge ⚡</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
    .table {
      --bs-table-bg: #161b22;
      --bs-table-color: #e6edf3;
      --bs-table-hover-bg: #1c2128;
      border-color: #30363d;
    }
    .table-dark { --bs-table-bg: #0d1117; }
    .form-control, .form-select {
      background: #161b22; color: #e6edf3; border-color: #30363d;
    }
    .form-control:focus, .form-select:focus {
      background: #161b22; color: #e6edf3;
      border-color: #0d6efd;
      box-shadow: 0 0 0 .25rem rgba(13,110,253,.25);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'bornes:liste' %}">⚡ ElectroCharge</a>
    <div class="d-flex gap-3">
      <a href="{% url 'bornes:liste' %}"       class="nav-link text-white">Bornes</a>
      <a href="{% url 'bornes:connecteurs' %}" class="nav-link text-white">Connecteurs</a>
      <a href="{% url 'bornes:sessions' %}"    class="nav-link text-white">Sessions</a>
    </div>
  </div>
</nav>
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
